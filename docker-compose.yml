services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: helpflow
      POSTGRES_USER: helpflow
      POSTGRES_PASSWORD: helpflow
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpflow -d helpflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  technician-dispatch-service:
    build:
      context: .
      dockerfile: technician-dispatch-service/Dockerfile
    ports:
      - "8081:8081"

  support-ticket-service:
    build:
      context: .
      dockerfile: support-ticket-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/helpflow
      SPRING_DATASOURCE_USERNAME: helpflow
      SPRING_DATASOURCE_PASSWORD: helpflow
      DISPATCH_BASE_URL: http://technician-dispatch-service:8081
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      technician-dispatch-service:
        condition: service_started

